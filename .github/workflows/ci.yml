name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify change scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/verify-readme-value.sh
          bash scripts/verify-installation-surface.sh
          bash scripts/ci-change-scope.sh --self-test
          full=true
          if [[ "$EVENT_NAME" != "workflow_dispatch" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            changed="$(git -c core.quotePath=true diff --name-status --no-renames "$BASE_SHA" "$HEAD_SHA")"
            full="$(git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" | bash scripts/ci-change-scope.sh --null)"
            {
              echo "### Change scope"
              echo
              echo "Full Rust checks: \`$full\`"
              echo
              echo '```text'
              printf '%s\n' "$changed"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "full=$full" >>"$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.85
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.85.0

      - name: Set up Node.js 24 for harness checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Run strict repository checks
        shell: bash
        run: bash scripts/ci-full-check.sh

  portability:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-2025
          - name: macOS arm64
            os: macos-15
          - name: macOS x86_64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Set up Node.js 24 for harness checks
        if: runner.os == 'Windows'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check cold-routing harnesses
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci-node-harness.sh

  gate:
    name: CI gate
    needs: [changes, linux, portability]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FULL: ${{ needs.changes.outputs.full }}
      LINUX_RESULT: ${{ needs.linux.result }}
      PORTABILITY_RESULT: ${{ needs.portability.result }}
      SCOPE_RESULT: ${{ needs.changes.result }}
    steps:
      - name: Verify required checks
        shell: bash
        run: |
          [[ "$SCOPE_RESULT" == "success" ]] || exit 1
          if [[ "$FULL" == "true" ]]; then
            [[ "$LINUX_RESULT" == "success" ]] || exit 1
            [[ "$PORTABILITY_RESULT" == "success" ]] || exit 1
          fi
