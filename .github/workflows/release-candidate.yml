name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version, for example 0.1.0-rc.1"
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record exact release SHA
        shell: bash
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$GITHUB_SHA" ]] || {
            echo "Checked out $actual_sha instead of event SHA $GITHUB_SHA" >&2
            exit 1
          }
          echo "Validated release SHA: \`$actual_sha\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Install Rust 1.85
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.85.0

      - name: Set up Node.js 24 for harness checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Run strict repository checks
        shell: bash
        run: bash scripts/ci-full-check.sh

  build:
    name: ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: unix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: windows
          - os: macos-15
            target: aarch64-apple-darwin
            package: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package: unix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact release SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install Rust 1.85
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target "$TARGET"
          rustup default 1.85.0

      - name: Validate release version
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]] || [[ "$version" == *..* ]]; then
            echo "Version must be SemVer without build metadata" >&2
            exit 1
          fi
          case "$TARGET" in
            x86_64-unknown-linux-gnu|x86_64-pc-windows-msvc|aarch64-apple-darwin|x86_64-apple-darwin) ;;
            *) echo "Unsupported release target: $TARGET" >&2; exit 1 ;;
          esac
          cargo_version="$(cargo pkgid --package skillroster)"
          cargo_version="${cargo_version##*#}"
          case "$version" in
            "$cargo_version"|"$cargo_version"-*) ;;
            *) echo "Version $version does not match Cargo package $cargo_version" >&2; exit 1 ;;
          esac

      - name: Run portability tests at release SHA
        run: cargo test --locked --all-targets --all-features

      - name: Build locked release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke-test Unix binary
        if: matrix.package == 'unix'
        shell: bash
        run: |
          "target/$TARGET/release/skillroster" --version
          "target/$TARGET/release/skillroster" --help >/dev/null

      - name: Smoke-test Windows binary
        if: matrix.package == 'windows'
        shell: pwsh
        run: |
          & "target/$env:TARGET/release/skillroster.exe" --version
          & "target/$env:TARGET/release/skillroster.exe" --help | Out-Null

      - name: Exercise release governance loop
        shell: pwsh
        run: |
          $binary = "target/$env:TARGET/release/skillroster"
          if ($IsWindows) { $binary = "$binary.exe" }
          scripts/release/smoke.ps1 -Binary $binary

      - name: Package Unix artifact
        if: matrix.package == 'unix'
        shell: bash
        run: scripts/release/package-unix.sh "$TARGET" "${RELEASE_VERSION#v}"

      - name: Package Windows artifact
        if: matrix.package == 'windows'
        shell: pwsh
        run: scripts/release/package-windows.ps1 -Target $env:TARGET -Version ($env:RELEASE_VERSION -replace '^v', '')

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: skillroster-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  wsl:
    name: WSL as Linux
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out smoke test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Linux release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: skillroster-x86_64-unknown-linux-gnu
          path: dist

      - name: Verify Linux artifact in Ubuntu WSL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $image = Join-Path $env:RUNNER_TEMP "ubuntu-24.04.4-wsl-amd64.wsl"
          $install = Join-Path $env:RUNNER_TEMP "skillroster-wsl"
          Invoke-WebRequest -Uri "https://releases.ubuntu.com/noble/ubuntu-24.04.4-wsl-amd64.wsl" -OutFile $image
          $actual = (Get-FileHash -Algorithm SHA256 $image).Hash.ToLowerInvariant()
          if ($actual -ne "9b2f7730dc68227dd04a9f3e5eab86ad85caf556b8606ad94f1f29ff5c4fd3f5") {
            throw "Ubuntu WSL image checksum mismatch: $actual"
          }
          wsl --import SkillRosterAcceptance $install $image --version 1
          if ($LASTEXITCODE -ne 0) { throw "WSL import failed with exit code $LASTEXITCODE" }
          try {
            function Convert-ToWslPath([string]$Path) {
              $full = [System.IO.Path]::GetFullPath($Path)
              $drive = $full.Substring(0, 1).ToLowerInvariant()
              $relative = $full.Substring(2).Replace('\', '/')
              return "/mnt/$drive$relative"
            }
            $archive = (Resolve-Path "dist/skillroster-*-x86_64-unknown-linux-gnu.tar.gz").Path
            $archiveWsl = Convert-ToWslPath $archive
            $repoWsl = Convert-ToWslPath $env:GITHUB_WORKSPACE
            wsl -d SkillRosterAcceptance --user root -- bash "$repoWsl/scripts/release/smoke-wsl.sh" $archiveWsl $repoWsl
            if ($LASTEXITCODE -ne 0) { throw "WSL governance smoke failed with exit code $LASTEXITCODE" }
          }
          finally {
            wsl --unregister SkillRosterAcceptance
          }
