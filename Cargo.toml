[package]
name = "skillroster"
version = "1.0.3"
edition = "2024"
rust-version = "1.85"
description = "Local skill governance for AI agents"
repository = "https://github.com/tt-a1i/skillroster"

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
ctrlc = "3.4"
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ulid = { version = "1.2", features = ["serde"] }

[dev-dependencies]
tempfile = "3.20"
