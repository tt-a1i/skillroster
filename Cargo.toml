[package]
name = "skillroster"
version = "1.8.39"
edition = "2024"
rust-version = "1.85"
description = "Local skill governance for AI agents"
repository = "https://github.com/tt-a1i/skillroster"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
aho-corasick = "1.1"
cap-primitives = "4.0"
cap-std = "4.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
ctrlc = "3.4"
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ulid = { version = "1.2", features = ["serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.20"
